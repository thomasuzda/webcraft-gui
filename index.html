<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebCraft Services</title>
</head>
<body>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&family=Poppins:wght@500;600&family=Fredoka:wght@500;600&display=swap');

  :root{
    --black:#08090c;
    --bg:#0c0e14;
    --box:#15171f;
    --border:rgba(255,255,255,0.14);
    --text:#e3e7ee;
    --text-muted:#949bab;
    --accent:#5c9dff;
    --accent-soft:rgba(92,157,255,0.14);
    --ok:#5cbf85;
    --ok-soft:rgba(92,191,133,0.16);
  }

  *{box-sizing:border-box;}
  body{
    position:relative;
    background:var(--black);
    min-height:100vh;
    margin:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    gap:18px;
    font-family:'Source Sans 3', system-ui, sans-serif;
    color:var(--text);
    padding:24px 16px 36px;
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed;
    inset:-10%;
    z-index:0;
    background:
      radial-gradient(ellipse 95% 65% at 50% 0%, rgba(190,198,212,0.16), transparent 74%),
      radial-gradient(ellipse 66% 52% at 58% 2%, rgba(92,157,255,0.16), transparent 72%),
      var(--black);
    animation:heroDrift 18s ease-in-out infinite;
    transform-origin:50% 0%;
  }
  @keyframes heroDrift{
    0%, 100%{ transform:scale(1) translate(0, 0); opacity:1; }
    50%{ transform:scale(1.06) translate(-1.5%, 1%); opacity:0.9; }
  }
  body > *{ position:relative; z-index:1; }
  @media (prefers-reduced-motion: reduce){ body::before{ animation:none; } }

  .heading{
    text-align:center;
    max-width:480px;
  }
  .heading .eyebrow{
    font-family:'Source Sans 3', sans-serif;
    font-size:1rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.02em;
    color:#fff;
  }
  .heading .eyebrow b{ color:var(--accent); font-weight:700; }
  .tagline{
    font-family:'Fraunces', Georgia, serif;
    font-weight:600;
    font-size:1.5rem;
    margin:0;
    color:#fff;
    text-align:center;
    text-wrap:balance;
    max-width:480px;
  }

  .tabs{
    position:relative;
    display:flex;
    gap:2px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:980px;
    padding:5px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .tab-highlight{
    position:absolute;
    top:0; left:0;
    width:0; height:0;
    border-radius:980px;
    background:rgba(92,157,255,0.18);
    border:1px solid var(--accent-line, rgba(92,157,255,0.45));
    box-shadow:0 0 0 1px rgba(92,157,255,0.2) inset;
    transition:transform 0.4s cubic-bezier(0.34, 1.4, 0.4, 1), width 0.4s cubic-bezier(0.34, 1.4, 0.4, 1), height 0.4s cubic-bezier(0.34, 1.4, 0.4, 1);
    pointer-events:none;
    z-index:0;
  }
  .tab{
    position:relative;
    z-index:1;
    font:inherit;
    font-size:0.82rem;
    font-weight:700;
    border:none;
    background:transparent;
    color:rgba(255,255,255,0.75);
    padding:9px 17px;
    border-radius:980px;
    cursor:pointer;
    white-space:nowrap;
    transition:background 0.2s ease, color 0.2s ease, transform 0.15s ease;
  }
  .tab:hover{ color:#fff; background:rgba(255,255,255,0.06); }
  .tab:active{ transform:scale(0.93); }
  .tab[aria-selected="true"]{ color:#fff; }
  .tab[aria-selected="true"]:hover{ background:transparent; }
  @media (prefers-reduced-motion: reduce){ .tab-highlight{ transition:none; } }

  .stage{
    position:relative;
    width:min(960px, 94vw);
    height:min(680px, 74vh);
    border-radius:18px;
    overflow:hidden;
    border:1px solid var(--border);
    background:var(--bg);
  }
  .stage-flow{
    position:absolute;
    inset:-40% -20%;
    z-index:0;
    pointer-events:none;
    -webkit-mask-image:radial-gradient(ellipse 80% 80% at 50% 50%, #000 55%, transparent 100%);
    mask-image:radial-gradient(ellipse 80% 80% at 50% 50%, #000 55%, transparent 100%);
  }
  .stage-flow::before,
  .stage-flow::after{
    content:"";
    position:absolute;
    inset:0;
    background:conic-gradient(from 0deg at 50% 45%,
      rgba(205,212,224,0) 0deg,
      rgba(205,212,224,0.40) 38deg,
      rgba(92,157,255,0.34) 92deg,
      rgba(205,212,224,0) 140deg,
      rgba(92,157,255,0.40) 200deg,
      rgba(205,212,224,0) 258deg,
      rgba(205,212,224,0.44) 320deg,
      rgba(92,157,255,0) 360deg);
    filter:blur(45px);
    animation:heroSpin 46s linear infinite;
  }
  .stage-flow::after{
    filter:blur(70px);
    opacity:0.65;
    animation-name:heroSpinReverse;
    animation-duration:72s;
  }
  @keyframes heroSpin{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
  @keyframes heroSpinReverse{ from{ transform:rotate(360deg); } to{ transform:rotate(0deg); } }
  @media (prefers-reduced-motion: reduce){
    .stage-flow::before, .stage-flow::after{ animation:none; }
  }

  .card{
    position:absolute;
    z-index:1;
    top:50%; left:50%;
    transform:translate(-50%, -50%) scale(1);
    width:300px;
    background:var(--box);
    border:1px solid var(--border);
    border-radius:13px;
    box-shadow:0 24px 48px -20px rgba(0,0,0,0.4);
    padding:22px;
    transition:opacity 0.16s ease, transform 0.16s ease;
  }
  .card.swap{ opacity:0; transform:translate(-50%,-50%) scale(0.97); }
  .card.card--flush{
    background:transparent;
    border:none;
    box-shadow:none;
    padding:0;
    width:max-content;
    max-width:88%;
  }
  .card--flush .kicker{
    color:rgba(255,255,255,0.85);
    text-shadow:0 1px 3px rgba(0,0,0,0.35);
    margin-bottom:8px;
  }
  .card--flush .pill.paid{
    background:rgba(255,255,255,0.22);
    color:#fff;
  }
  .card.card--fill{
    width:calc(100% - 16px);
    height:calc(100% - 16px);
    max-width:none;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
  .card--fill .phone-row{
    flex:1;
    min-height:0;
    align-items:center;
  }
  .seo-exact{
    width:100%;
    height:auto;
    display:block;
    border-radius:10px;
  }
  .card--fill .site-preview,
  .card--fill .code-window,
  .card--fill .host-dash,
  .card--fill .support-panel{
    flex:1;
    min-height:0;
  }

  /* ---- Software: portfolio code browser ---- */
  .code-window{
    width:100%;
    display:flex;
    flex-direction:column;
    border-radius:11px;
    overflow:hidden;
    background:#1b1d23;
    box-shadow:0 20px 40px -18px rgba(0,0,0,0.5);
  }
  .code-chrome{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 10px;
    background:#22242c;
    border-bottom:1px solid #2e313b;
  }
  .code-dot{ width:8px; height:8px; border-radius:50%; background:#3a3d47; }
  .code-tabs{ display:flex; gap:2px; margin-left:4px; }
  .code-tab{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.62rem;
    color:#787c8a;
    padding:4px 9px;
    border-radius:5px;
    white-space:nowrap;
  }
  .code-tab.active{ background:#2e313b; color:#e8eaf0; }

  /* ---- Software: GitHub repo browser ---- */
  .gh-window{
    position:relative;
    width:100%; height:100%;
    display:flex; flex-direction:column;
    background:#0d1117;
    border-radius:11px;
    overflow:hidden;
    box-shadow:0 20px 40px -18px rgba(0,0,0,0.5);
  }
  .gh-chrome{
    display:flex; align-items:center; gap:10px;
    padding:8px 10px;
    background:#161b22;
    border-bottom:1px solid #30363d;
    flex-shrink:0;
  }
  .gh-url{ font-family:'IBM Plex Mono', monospace; font-size:0.66rem; color:#8b949e; }
  .gh-body{ position:relative; flex:1; min-height:0; }
  .gh-view{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease;
  }
  .gh-view.show{ opacity:1; pointer-events:auto; }
  .gh-repo-bar{
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 12px;
    border-bottom:1px solid #21262d;
    flex-shrink:0;
  }
  .gh-repo-name{ font-size:0.74rem; color:#c9d1d9; display:flex; align-items:center; gap:6px; }
  .gh-repo-name svg{ flex-shrink:0; }
  .gh-repo-name b{ font-weight:700; }
  .gh-branch{
    display:flex; align-items:center; gap:5px;
    background:#21262d; border:1px solid #30363d; border-radius:6px;
    padding:3px 9px;
    font-size:0.66rem; color:#c9d1d9;
  }
  #ghList{ overflow-y:auto; }
  .gh-nav-tabs{
    display:flex; align-items:center; gap:16px;
    padding:0 12px;
    border-bottom:1px solid #21262d;
    flex-shrink:0;
  }
  .gh-nav-tab{
    display:flex; align-items:center; gap:6px;
    padding:9px 2px;
    font-size:0.68rem; color:#8b949e; font-weight:600;
    border-bottom:2px solid transparent;
  }
  .gh-nav-tab.active{ color:#c9d1d9; border-bottom-color:#f78166; }
  .gh-nav-count{
    background:#21262d; color:#8b949e;
    font-size:0.6rem; font-weight:700;
    border-radius:100px; padding:1px 6px;
  }
  .gh-filetable{ flex-shrink:0; overflow:hidden; }
  .gh-file-row{
    display:flex; align-items:center; gap:9px;
    padding:6.5px 12px;
    border-bottom:1px solid #21262d;
    transition:background 0.15s ease;
  }
  .gh-file-row.active{ background:#161b22; }
  .gh-file-icon{ flex-shrink:0; }
  .gh-file-name{ color:#c9d1d9; font-size:0.72rem; width:98px; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .gh-file-msg{ color:#8b949e; font-size:0.68rem; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .gh-file-time{ color:#8b949e; font-size:0.64rem; flex-shrink:0; }
  .gh-readme{
    flex-shrink:0;
    margin:16px 12px 12px;
    border:1px solid #21262d;
    border-radius:8px;
    overflow:hidden;
  }
  .gh-readme-head{
    display:flex; align-items:center; gap:6px;
    padding:8px 12px;
    background:#161b22;
    border-bottom:1px solid #21262d;
    font-size:0.68rem; color:#c9d1d9; font-weight:600;
  }
  .gh-readme-body{ padding:14px 16px; font-size:0.7rem; line-height:1.6; color:#c9d1d9; }
  .gh-readme-body h1{ font-size:1rem; margin:0 0 8px; color:#e6edf3; border-bottom:1px solid #21262d; padding-bottom:8px; }
  .gh-readme-body h2{ font-size:0.82rem; margin:14px 0 6px; color:#e6edf3; }
  .gh-readme-body p{ margin:0 0 8px; color:#8b949e; }
  .gh-readme-body ul{ margin:0 0 10px; padding-left:18px; color:#8b949e; }
  .gh-readme-body li{ margin-bottom:3px; }
  .gh-readme-body code{ background:#161b22; border-radius:4px; padding:1px 5px; font-family:'IBM Plex Mono', monospace; font-size:0.9em; color:#e6edf3; }
  .gh-readme-body b{ color:#c9d1d9; }
  .gh-readme-body pre{
    background:#161b22; border:1px solid #21262d; border-radius:6px;
    padding:9px 12px; margin:0;
    font-family:'IBM Plex Mono', monospace; font-size:0.68rem; line-height:1.6; color:#8b949e;
  }
  .gh-code-bar{
    display:flex; align-items:center; gap:8px;
    padding:9px 12px;
    border-bottom:1px solid #21262d;
    flex-shrink:0;
  }
  .gh-back{ color:#8b949e; cursor:default; font-size:0.85rem; line-height:1; }
  .gh-breadcrumb{ font-family:'IBM Plex Mono', monospace; font-size:0.68rem; color:#c9d1d9; }
  .gh-breadcrumb b{ color:#58a6ff; font-weight:600; }
  .gh-code-body{ flex:1; min-height:0; overflow:hidden; padding:12px 14px; }
  .gh-cursor{ z-index:5; filter:drop-shadow(0 1px 2px rgba(0,0,0,0.6)); }
  .gh-cursor path{ fill:#fff; stroke:#fff; }
  .code-body{
    flex:1;
    min-height:0;
    overflow:hidden;
    padding:12px 14px;
  }
  .code-lines{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.68rem;
    line-height:1.75;
    white-space:pre;
    transition:transform 0.6s ease;
    color:#d4d4d8;
  }
  .code-lines .ln{ color:#4b4e5a; display:inline-block; width:20px; user-select:none; }
  .code-lines .c1{ color:#c586c0; }
  .code-lines .c2{ color:#4ec9b0; }
  .code-lines .c3{ color:#ce9178; }
  .code-lines .c4{ color:#9cdcfe; }
  .code-lines .c5{ color:#6a9955; }
  .code-lines .c6{ color:#dcdcaa; }
  .code-lines .plain{ color:#d4d4d8; }

  /* ---- SEO: three phones searching ---- */
  .phone-row{
    display:flex;
    gap:clamp(8px, 3vw, 18px);
    align-items:center;
    justify-content:center;
    width:100%;
  }
  .phone{
    position:relative;
    width:clamp(92px, 30vw, 156px);
    aspect-ratio:156/318;
    height:auto;
    container-type:inline-size;
    border-radius:22px;
    background:#101114;
    padding:6px;
    box-shadow:0 22px 40px -18px rgba(0,0,0,0.55);
  }
  .phone::before{
    content:"";
    position:absolute;
    top:6px; left:50%;
    transform:translateX(-50%);
    width:38%;
    height:6.5%;
    min-height:14px;
    background:#000;
    border-radius:100px;
    z-index:2;
  }
  .phone-screen{
    width:100%; height:100%;
    border-radius:17px;
    background:#fff;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    font-family:'Source Sans 3', sans-serif;
  }
  .phone-status{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:6px 12px 2px;
    font-size:6.7cqw;
    font-weight:600;
    color:#111;
  }
  .phone-status .icons{ display:flex; align-items:center; gap:3px; }
  .phone-status svg{ width:11px; height:8px; display:block; }

  .phone-app-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:6px 10px 8px;
  }
  .g-menu{ flex-shrink:0; }
  .g-avatar{
    flex-shrink:0;
    width:11cqw; height:11cqw;
    min-width:19px; min-height:19px;
    border-radius:50%;
    background:linear-gradient(135deg, #6ea8fe, #5b8def);
    color:#fff;
    font-family:'Poppins', sans-serif;
    font-size:5.4cqw;
    font-weight:600;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 1px rgba(255,255,255,0.6);
  }
  .phone-app-bar .g-logo{ font-family:'Fredoka', sans-serif; font-size:9.4cqw; font-weight:600; letter-spacing:-0.01em; }
  .phone-app-bar .g-logo b:nth-child(1){ color:#4285f4; }
  .phone-app-bar .g-logo b:nth-child(2){ color:#ea4335; }
  .phone-app-bar .g-logo b:nth-child(3){ color:#fbbc05; }
  .phone-app-bar .g-logo b:nth-child(4){ color:#4285f4; }
  .phone-app-bar .g-logo b:nth-child(5){ color:#34a853; }
  .phone-app-bar .g-logo b:nth-child(6){ color:#ea4335; }

  .phone-searchbar{
    display:flex;
    align-items:center;
    gap:6px;
    margin:0 9px;
    padding:5px 9px;
    border-radius:100px;
    background:#f1f3f4;
    font-size:6.7cqw;
    color:#3c4043;
  }
  .phone-searchbar svg{ flex-shrink:0; }
  .phone-searchbar .q::after{ content:''; display:inline-block; width:1px; height:7px; background:#3c4043; margin-left:1px; animation:phoneCaret 1s step-end infinite; }
  @keyframes phoneCaret{ 50%{ opacity:0; } }
  .phone-tabs{
    display:flex;
    gap:9px;
    margin:6px 9px 0;
    padding-bottom:4px;
    border-bottom:1px solid #e8eaed;
    font-size:5.6cqw;
    color:#5f6368;
  }
  .phone-tabs .on{ color:#1a73e8; font-weight:700; border-bottom:1.5px solid #1a73e8; padding-bottom:4px; margin-bottom:-5px; }
  .phone-section-label{ font-size:5.3cqw; font-weight:700; color:#202124; margin:6px 9px 3px; }
  .phone-map-thumb{
    position:relative;
    margin:0 9px;
    height:44px;
    border-radius:6px;
    background:
      radial-gradient(ellipse 55% 60% at 82% 20%, #aad9e8 0%, #aad9e8 55%, transparent 72%),
      radial-gradient(ellipse 50% 55% at 18% 78%, #c2e3ae 0%, #c2e3ae 55%, transparent 72%),
      #f7f4ee;
    overflow:hidden;
  }
  .phone-map-thumb .road{ position:absolute; background:#fff; border-radius:100px; box-shadow:0 0 0 0.5px rgba(0,0,0,0.06); }
  .phone-map-thumb .pin{ position:absolute; width:6px; height:6px; }
  .thumb-marker{ position:absolute; display:flex; align-items:center; gap:2px; }
  .thumb-marker span{
    font-size:3.6cqw;
    font-weight:700;
    color:#b31412;
    background:rgba(255,255,255,0.85);
    padding:0 3px;
    border-radius:2px;
    white-space:nowrap;
  }
  .phone-listing{
    margin:6px 9px 0;
    font-size:5.9cqw;
    line-height:1.4;
  }
  .phone-listing .l-name{ font-weight:700; color:#202124; }
  .phone-listing .l-meta{ color:#70757a; font-size:5.3cqw; }
  .l-star{ color:#f9ab00; }
  .phone-result{
    opacity:0;
    transition:opacity 0.4s ease;
  }
  .phone-result.show{ opacity:1; }
  .r-result{ margin:8px 9px 0; padding-top:7px; border-top:1px solid #ebebeb; }
  .r-site{ display:flex; align-items:center; gap:6px; margin-bottom:3px; }
  .r-favicon{
    width:16px; height:16px; flex-shrink:0;
    border-radius:50%;
    background:#e8945c;
    color:#fff;
    font-size:8px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .r-site-text{ font-size:4.6cqw; line-height:1.35; color:#202124; }
  .r-url{ color:#4d5156; font-size:4.2cqw; }
  .r-title{ color:#1a5fc4; font-weight:500; font-size:5.6cqw; line-height:1.3; margin:2px 0 3px; }
  .r-snippet{ color:#4d5156; font-size:4.2cqw; line-height:1.4; margin-bottom:5px; }
  .r-rating{ font-size:4.2cqw; margin-bottom:6px; }
  .r-actions{ display:flex; gap:8px; padding-bottom:8px; }
  .r-actions span{
    flex:1;
    display:flex; align-items:center; justify-content:center; gap:4px;
    font-size:4.4cqw; font-weight:600; color:#1a73e8;
    border:1px solid #dadce0;
    border-radius:100px;
    padding:5px 0;
  }
  .r-actions svg{ flex-shrink:0; }

  /* ChatGPT phone */
  .phone-gpt-bar{
    display:flex; align-items:center; justify-content:space-between;
    padding:5px 9px 7px;
    font-size:6.1cqw; font-weight:700; color:#111;
  }
  .gpt-menu{ flex-shrink:0; }
  .gpt-brand-pill{
    display:flex; align-items:center; gap:5px;
    border:1px solid #e3e3e3;
    border-radius:100px;
    padding:4px 10px;
    font-size:5cqw;
    font-weight:600;
  }
  .gpt-brand-pill svg{ flex-shrink:0; }
  .gpt-bar-icons{ display:flex; align-items:center; gap:11px; }
  .gpt-bar-icons svg{ flex-shrink:0; }
  .phone-gpt-body{ flex:1; padding:0 9px; display:flex; flex-direction:column; gap:6px; overflow:hidden; }
  .phone-bubble{
    max-width:84%;
    font-size:5.6cqw;
    line-height:1.45;
    padding:5px 7px;
    border-radius:8px;
    opacity:0;
    transform:translateY(3px);
    transition:opacity 0.3s ease, transform 0.3s ease;
  }
  .phone-bubble.show{ opacity:1; transform:none; }
  .phone-bubble.user{ align-self:flex-end; background:#f1f3f4; color:#111; }

  let SCALE = 0.585;
  const DESKTOP_SITE_WIDTH = 1100;
  function fitDesktopFrame(doc, frame, wrap) {
    /* Recomputed on every screen change, not just once at mount: the
       landing screen and the chat screen are different heights (the
       chat screen grows as messages/quiz cards stack up), so a single
       fixed "page height" guess leaves later screens cropped or puts
       the cursor below the visible box. Measuring the CURRENTLY VISIBLE
       screen's real height keeps everything (and the cursor) inside
       the box no matter which screen is showing.

       The frame itself is rendered at a DESKTOP width (not the 480px
       mobile width mobile uses), so the real site's own desktop CSS
       (max-width:600px mobile rules don't apply above 600px) lays out
       like an actual website instead of a phone column floating in a
       wide box - then we zoom the whole thing out to fit. */
    const w = DESKTOP_SITE_WIDTH;
    if (frame.style.width !== w + 'px') frame.style.width = w + 'px';
    /* Capped at 900 - the iframe's own fixed viewport height (see
       .site-frame's CSS height below). The landing and chat screens both
       fit inside that naturally; the quiz screen is a long question list
       that scrolls the real page past 900px, same as any normal webpage -
       it should scroll into view question by question, not get zoomed out
       to cram all 30 questions into the box at once. */
    const h = Math.min(Math.max(doc.body.scrollHeight, 400), 900);
    SCALE = Math.min(wrap.clientWidth / w, wrap.clientHeight / h);
    frame.style.left = Math.round((wrap.clientWidth - w * SCALE) / 2) + 'px';
    frame.style.top = Math.round((wrap.clientHeight - h * SCALE) / 2) + 'px';
    frame.style.transform = `scale(${SCALE})`;
  }
  let demoTimers = [];
  function later(fn, ms) { demoTimers.push(setTimeout(fn, ms)); }
  function stopDemo() { demoTimers.forEach(clearTimeout); demoTimers = []; }

  function runDemo(doc, desktop) {
    const cursor = document.getElementById('demoCursor');
    const ring = document.getElementById('demoRing');
    const frame = document.getElementById('siteFrame');
    const wrap = document.querySelector('.site-frame-wrap');
    if (!cursor || !doc) return;

    /* The whole Websites demo timeline shifted 2s earlier - every cursor
       move/click in this function goes through runLater instead of the
       shared later() so only this tab speeds up. */
    const runLater = (fn, ms) => later(fn, Math.max(0, ms - 2000));

    let panY = 0;
    const panFrame = (px) => {
      panY = px;
      if (frame) frame.style.transform = `scale(${SCALE}) translateY(${-px}px)`;
    };
    /* On mobile the iframe is scaled to fill the box's width, which makes
       the rendered page taller than the box - fine for the landing screen
       (the important bits are all up top), but it crops the chat composer
       off the bottom. Panning up (cropping the header instead) keeps the
       composer on screen. On desktop the frame is instead scaled to fit
       the WHOLE page inside the box (see mountSite), so nothing is ever
       cropped and no panning is needed or wanted. */
    const panToReveal = (el) => {
      if (desktop || !el || !wrap) return;
      const visibleH = wrap.clientHeight / SCALE;
      const bottom = el.getBoundingClientRect().bottom;
      panFrame(Math.max(0, bottom - visibleH));
    };

    const show = (id) => {
      doc.querySelectorAll('.screen').forEach(s => s.classList.remove('demo-on'));
      const el = doc.getElementById(id);
      if (el) { el.removeAttribute('hidden'); el.classList.add('demo-on'); }
      if (desktop && frame && wrap) fitDesktopFrame(doc, frame, wrap);
    };
    const moveTo = (el, dx = 0, dy = 0) => {
      if (!el || !frame) return;
      const r = el.getBoundingClientRect();
      const offX = parseFloat(frame.style.left) || 0;
      const offY = parseFloat(frame.style.top) || 0;
      const x = offX + (r.left + r.width / 2) * SCALE + dx;
      const y = offY + (r.top + r.height / 2 - panY) * SCALE + dy;
      cursor.style.transform = `translate(${x}px, ${y}px)`;
    };
    const tap = () => { ring.classList.remove('tap'); void ring.offsetWidth; ring.classList.add('tap'); };

    const QUESTION = 'write a quiz on cell structure';

    function answerQuestion(i, doc, cb) {

      const btn = card.querySelector('.answer[data-option="' + item.correct + '"]');

      const cardTop = card.getBoundingClientRect().top + target.scrollTop;

      autoScroll(target, toY, 1500, () => {

            if (feedback) {
              feedback.querySelector('.feedback__verdict').textContent = 'Correct';
              feedback.querySelector('.feedback__verdict').className = 'feedback__verdict feedback__verdict--correct';
              feedback.querySelector('.feedback__explanation').textContent = item.why;
              feedback.hidden = false;
            }
            card.classList.add('is-revealed');
            const fill = doc.getElementById('progress-fill');
            if (fill) fill.style.width = Math.round(((i + 1) / QUIZ_DATA.length) * 100) + '%';
            runLater(cb, 1300);
          }, 650);
        }, 300);
      });
    }

    function answerAllQuestions(doc, i, cb) {
      if (i >= QUIZ_DATA.length) { if (cb) cb(); return; }
      answerQuestion(i, doc, () => answerAllQuestions(doc, i + 1, cb));
    }

    function autoScroll(container, toY, duration, onDone) {
      const startY = container.scrollTop;
      const dist = toY - startY;
      const t0 = performance.now();
      function step(now) {
        const p = Math.min(1, (now - t0) / duration);
        const eased = 1 - Math.pow(1 - p, 3);
        container.scrollTop = startY + dist * eased;
        if (p < 1) requestAnimationFrame(step);
        else if (onDone) onDone();
      }
      requestAnimationFrame(step);
    }

    // ---- sequence ----
    show('screen-landing');
    panFrame(0);
    const startOffX = (frame && parseFloat(frame.style.left)) || 0;
    const startOffY = (frame && parseFloat(frame.style.top)) || 0;
    cursor.style.transform = `translate(${startOffX + 230}px, ${startOffY + 180}px)`;
    const guest = doc.getElementById('landing-guest');

    runLater(() => moveTo(guest), 3000);
    runLater(() => {
      tap();
      show('screen-home');
      const input = doc.getElementById('chat-input');
      if (input) input.value = '';
      panToReveal(doc.getElementById('chat-form'));
    }, 4300);

    runLater(() => moveTo(doc.getElementById('chat-input')), 5100);
    runLater(() => tap(), 6000);

    runLater(() => {
      const input = doc.getElementById('chat-input');
      if (!input) return;
      QUESTION.split('').forEach((ch, i) => {
        runLater(() => { input.value = QUESTION.slice(0, i + 1); }, i * 70);
      });
    }, 6500);

    const typedDone = 6500 + QUESTION.length * 70 + 500;
    runLater(() => moveTo(doc.querySelector('.chat-send')), typedDone);
    runLater(() => {
      tap();
      const input = doc.getElementById('chat-input');
      addMessage('user', QUESTION);
      if (input) input.value = '';
      askDifficulty();
    }, typedDone + 1100);

    function askDifficulty() {
      runLater(() => {
        const bubble = addMessage('assistant', 'Building a quiz on that. How hard should it be?');
        const row = addChoices(bubble, [
          { label: 'Easy \u2014 mostly recall' },
          { label: 'Medium', primary: true },
          { label: 'Hard \u2014 requires reasoning' },
        ]);
        pickChoice(row, bubble, 'Easy \u2014 mostly recall', 1700, askFormat);
      }, 900);
    }

    function askFormat() {
      const bubble = addMessage('assistant', 'What format?');
      const row = addChoices(bubble, [
        { label: 'Mixed', primary: true },
        { label: 'Multiple choice only' },
      ]);
      pickChoice(row, bubble, 'Multiple choice only', 1700, askFocus);
    }

    function askFocus() {
      const bubble = addMessage('assistant', 'Cover it broadly, or lean a particular way?');
      const row = addChoices(bubble, [
        { label: 'Broad overview', primary: true },
        { label: 'Just the key facts' },
        { label: 'Deeper cuts, lesser-known details' },
      ]);
      pickChoice(row, bubble, 'Broad overview', 1700, askCount);
    }

    function askCount() {
      const bubble = addMessage('assistant', 'How many questions?');
      const row = addChoices(bubble, [
        { label: '5' }, { label: '10', primary: true }, { label: '15' }, { label: '20' }, { label: '30' },
      ]);
      pickChoice(row, bubble, '10', 1700, writingQuiz);
    }

    function writingQuiz() {
      addMessage('assistant', 'Writing your quiz...');
      runLater(showReadyCard, 2000);
    }

    function showReadyCard() {
      const box = doc.getElementById('chat-messages');
      const { card, start } = addReadyCard(box, 6);
      runLater(() => {
        moveTo(start);
        runLater(() => {
          tap();
          card.remove();
          const ask = doc.createElement('p');
          ask.className = 'chat-note';
          ask.textContent = 'When should I show you the answers?';
          box.appendChild(ask);
          const row = addChoices(box, [
            { label: 'As I answer', primary: true },
            { label: 'After I submit' },
          ]);
          pickChoice(row, box, 'As I answer', 1700, showQuiz);
        }, 700);
      }, 900);
    }

    function showQuiz() {
      runLater(() => {
        buildQuiz();
        show('screen-quiz');
        panFrame(0);
        const fill = doc.getElementById('progress-fill');
        if (fill) fill.style.width = '0%';
      }, 400);

      runLater(() => {
        answerAllQuestions(doc, 0, () => {
          const target = (doc.scrollingElement || doc.documentElement || doc.body);
          autoScroll(target, 0, 1800, () => {
            cursor.style.opacity = '0';
            runLater(() => { cursor.style.transform = `translate(${startOffX + 230}px, ${startOffY + 180}px)`; }, 200);
            runLater(() => runDemo(doc, desktop), 2200);
          });
        });
      }, 1700);
    }
  }

  function mountSite() {
    stopDemo();
    const f = document.getElementById("siteFrame");
    if (!f) return;
    f.addEventListener('load', () => {
      const doc = f.contentDocument;
      if (!doc) return;
      const wrap = document.querySelector('.site-frame-wrap');
      let desktop = false;
      if (wrap && wrap.clientWidth) {
        /* Desktop (>620px, matching our one CSS breakpoint) gets "contain"
           scaling - shrink to fit the FULL page (480x760) inside the box
           with no cropping, ever, even if that leaves a sliver of letterbox
           on the narrow axis. Mobile keeps the old "cover" scaling (fills
           the box width, taller than it, needs panning) untouched, since
           it's already tuned and the user asked not to touch it. */
        desktop = window.innerWidth > 620;
        if (desktop) {
          fitDesktopFrame(doc, f, wrap);
        } else {
          f.style.width = '480px';
          SCALE = wrap.clientWidth / 480;
          f.style.left = '0px';
          f.style.top = '0px';
          f.style.transform = `scale(${SCALE})`;
        }
      }
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        doc.querySelectorAll('.screen').forEach(s => s.classList.remove('demo-on'));
        const landing = doc.getElementById('screen-landing');
        if (landing) landing.classList.add('demo-on');
        return;
      }
      runDemo(doc, desktop);
    }, { once: true });
    f.srcdoc = decodeURIComponent(escape(atob(document.getElementById("siteDoc").textContent.trim())));
  }

  function render(i) {
    const tabButtons = [...tabsEl.querySelectorAll('.tab')];
    tabButtons.forEach((btn, idx) => btn.setAttribute('aria-selected', idx === i ? 'true' : 'false'));
    positionHighlight(tabButtons[i]);
    cardEl.classList.add('swap');
    stopDemo();
    setTimeout(() => {
      cardEl.innerHTML = tabs[i].render();
      cardEl.classList.add('card--flush');
      cardEl.classList.add('card--fill');
      if (i === 0) mountSite();
      else if (tabs[i].mount) tabs[i].mount();
      cardEl.classList.remove('swap');
    }, 140);
  }

  render(0);
</script>

</body>
